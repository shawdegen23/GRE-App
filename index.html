let SB=null, SESSION=null, SYNC_ON=false;
function initSB(){ try{ if(window.supabase && !SB){ SB=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true}}); } }catch(e){} return SB; }

function deckToRow(d){return {id:d.id,name:d.name,emoji:d.emoji||null,smart:!!d.smart,parent_id:d.parentId||null,sort:d.createdAt||0,
  meta:{createdAt:d.createdAt||0,seedTag:d.seedTag||null,greContainer:!!d.greContainer,imgCleaned:!!d.imgCleaned},deleted:false,updated_at:new Date().toISOString()};}
function rowToDeck(r){const m=r.meta||{};const o={id:r.id,name:r.name,emoji:r.emoji||'📁',smart:!!r.smart,parentId:r.parent_id||null,createdAt:m.createdAt||r.sort||Date.now()};
  if(m.seedTag)o.seedTag=m.seedTag; if(m.greContainer)o.greContainer=true; if(m.imgCleaned)o.imgCleaned=true; return o;}
function cardToRow(c){return {id:c.id,deck_id:c.deckId,front_text:c.frontText||'',front_image:c.frontImage||'',back_text:c.backText||'',back_image:c.backImage||'',srs:c.srs||{},deleted:false,updated_at:new Date().toISOString()};}
function rowToCard(r){return {id:r.id,deckId:r.deck_id,frontText:r.front_text||'',frontImage:r.front_image||'',backText:r.back_text||'',backImage:r.back_image||'',srs:r.srs||freshSRS(),createdAt:Date.now()};}

async function cloudUpsert(table,rows){ try{ if(!SB||!SESSION||!rows.length)return; const {error}=await SB.from(table).upsert(rows); if(error)console.warn('sync upsert',table,error.message);}catch(e){console.warn(e);} }
async function cloudSoftDelete(table,id){ try{ if(!SB||!SESSION)return; await SB.from(table).update({deleted:true,updated_at:new Date().toISOString()}).eq('id',id);}catch(e){console.warn(e);} }

async function pushAllToCloud(){
  const dks=await getAll('decks'), cds=await getAll('cards');
  if(dks.length) await cloudUpsert('decks',dks.map(deckToRow));
  const rows=cds.map(cardToRow);
  for(let i=0;i<rows.length;i+=150) await cloudUpsert('cards',rows.slice(i,i+150));
}
async function pullFromCloud(){
  const a=await SB.from('decks').select('*').eq('deleted',false);
  const b=await SB.from('cards').select('*').eq('deleted',false);
  if(a.error||b.error){console.warn('pull',a.error||b.error);return;}
  await clearStore('decks'); await clearStore('cards');
  for(const r of (a.data||[])) await put('decks',rowToDeck(r));
  for(const r of (b.data||[])) await put('cards',rowToCard(r));
}
async function onSignedIn(session){
  SESSION=session; SYNC_ON=false;
  try{
    const {count}=await SB.from('decks').select('id',{count:'exact',head:true});
    if((count||0)===0){ await pushAllToCloud(); toast('Synced — your cards are now in the cloud'); }
    else { await pullFromCloud(); toast('Synced ✓'); }
  }catch(e){ toast('Sync error: '+e.message); }
  SYNC_ON=true;
  await loadDecks(); render();
}

  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px">

    </div>
  </div></div>`;
  setTimeout(()=>{const el=$('#loginEmail');if(el)el.focus();},50);

let _loginEmail='';
async function sendCode(){
  if(!initSB()){toast('Sync unavailable — check your connection');return;}
  const email=$('#loginEmail').value.trim(); if(!email||email.indexOf('@')<0){toast('Enter a valid email');return;}
  const b=$('#sendCodeBtn'); b.disabled=true; b.textContent='Sending…';
  const {error}=await SB.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  if(error){toast(error.message); b.disabled=false; b.textContent='Send code'; return;}
  _loginEmail=email; $('#loginStep1').classList.add('hidden'); $('#loginStep2').classList.remove('hidden');
  setTimeout(()=>{const el=$('#loginCode');if(el)el.focus();},50);
}
async function verifyCode(){
  const token=$('#loginCode').value.trim(); if(!token){toast('Enter the code');return;}
  const b=$('#verifyBtn'); b.disabled=true; b.textContent='Verifying…';
  const {data,error}=await SB.auth.verifyOtp({email:_loginEmail,token,type:'email'});
  if(error){toast(error.message); b.disabled=false; b.textContent='Verify & sync'; return;}
  closeModal(); await onSignedIn(data.session);
}

  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:380px">

      <button class="btn ghost danger" onclick="signOutNow()">Sign out</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div></div>`;
}
async function syncNow(){ if(!SB||!SESSION)return; SYNC_ON=false; await pullFromCloud(); SYNC_ON=true; await loadDecks(); closeModal(); render(); toast('Synced ✓'); }
async function signOutNow(){ try{ await SB.auth.signOut(); }catch(e){} SESSION=null; SYNC_ON=false; closeModal(); render(); toast('Signed out (data stays on this device)'); }
async function restoreSession(){
  if(!initSB()) return;
  try{
    const {data}=await SB.auth.getSession();
    if(data && data.session){ SESSION=data.session; SYNC_ON=false; await pullFromCloud(); SYNC_ON=true; await loadDecks(); }
  }catch(e){ console.warn('restore',e); }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Flashcards</title>
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Flashcards" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
    --text:#1a1d23; --muted:#6b7280; --line:#e7e9ee;
    --brand:#4f46e5; --brand-soft:#eef0fe; --brand-ink:#3730a3;
    --green:#16a34a; --green-soft:#e8f6ee;
    --amber:#d97706; --amber-soft:#fcf3e6;
    --red:#dc2626; --red-soft:#fdecec;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --shadow-lg:0 12px 40px rgba(16,24,40,.16);
    --radius:16px; --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea{font-family:inherit}
  .app{max-width:920px;margin:0 auto;padding:24px 20px 80px}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .topbar h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
  .topbar .spacer{flex:1}
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:500}
  .crumb button{color:var(--brand);font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px}
  .crumb button:hover{background:var(--brand-soft)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;
    padding:10px 16px;border-radius:10px;background:var(--surface);color:var(--text);
    border:1px solid var(--line);transition:.15s;box-shadow:var(--shadow)
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 16px rgba(79,70,229,.28)}
  .btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#eef0f3;color:var(--text)}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* Folder grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .folder{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);transition:.18s;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:148px
  }
  .folder:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .folder .ftop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .folder .icon{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:20px}
  .folder .fname{font-weight:700;font-size:17px;letter-spacing:-.01em;word-break:break-word}
  .folder .fmeta{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .pill.smart{background:var(--brand-soft);color:var(--brand-ink)}
  .pill.classic{background:#eef0f3;color:var(--muted)}
  .pill.due{background:var(--amber-soft);color:var(--amber)}
  .add-folder{
    border:2px dashed var(--line);background:transparent;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    color:var(--muted);font-weight:600;min-height:148px;transition:.18s
  }
  .add-folder:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .add-folder .plus{font-size:30px;line-height:1}

  /* Card list */
  .card-row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-bottom:10px
  }
  .card-row .side{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .card-row .thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#eef0f3;flex-shrink:0}
  .card-row .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
  .card-row .txt.empty{color:#b6bcc6;font-style:italic}
  .card-row .arrow{color:#c7ccd6;font-size:18px;flex-shrink:0}
  .card-row .acts{display:flex;gap:4px;flex-shrink:0}
  .icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
  .icon-btn:hover{background:#eef0f3;color:var(--text)}

  /* Mode toggle bar in deck */
  .deckhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px}
  .deckhead .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .deckhead .title{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .deckhead .stats{color:var(--muted);font-size:13px;margin-top:4px}
  .seg{display:inline-flex;background:#eef0f3;border-radius:10px;padding:3px;gap:2px}
  .seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .switch-wrap{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .switch{position:relative;width:46px;height:26px;border-radius:999px;background:#cbd0d9;transition:.2s;flex-shrink:0}
  .switch.on{background:var(--brand)}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on .knob{left:23px}
  .switch-label{font-size:14px;font-weight:600}
  .switch-sub{font-size:12px;color:var(--muted)}

  /* Empty states */
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-state .big{font-size:42px;margin-bottom:12px}
  .empty-state .t{font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px}
  .modal h2{margin:0 0 18px;font-size:19px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em}
  .field input[type=text],.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface-2);transition:.15s
  }
  .field input[type=text]:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
  .field textarea{resize:vertical;min-height:64px}
  .cardside{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2)}
  .cardside .sidelabel{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
  .img-drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;margin-top:8px}
  .img-drop:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .img-preview{position:relative;margin-top:10px;border-radius:10px;overflow:hidden;display:inline-block;max-width:100%}
  .img-preview img{max-width:100%;max-height:160px;display:block;border-radius:10px}
  .img-preview .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

  /* Study */
  .study-wrap{max-width:620px;margin:0 auto}
  .study-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .progress{flex:1;height:8px;border-radius:999px;background:#e7e9ee;overflow:hidden}
  .progress .bar{height:100%;background:var(--brand);width:0;transition:.3s}
  .study-count{font-size:13px;font-weight:600;color:var(--muted)}
  .flashcard{
    background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);
    min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:40px 32px;text-align:center;cursor:pointer;position:relative;user-select:none
  }
  .flashcard .face-label{position:absolute;top:16px;left:20px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#b6bcc6}
  .flashcard .ftext{font-size:26px;font-weight:600;letter-spacing:-.01em;word-break:break-word}
  .flashcard img{max-width:100%;max-height:220px;border-radius:14px;object-fit:contain}
  .flashcard .hint{position:absolute;bottom:16px;font-size:12px;color:#b6bcc6;font-weight:600}
  .rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
  .rate{padding:14px 8px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:.15s}
  .rate:hover{transform:translateY(-2px)}
  .rate .sub{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
  .rate.again{color:var(--red)} .rate.again:hover{background:var(--red-soft);border-color:var(--red)}
  .rate.hard{color:var(--amber)} .rate.hard:hover{background:var(--amber-soft);border-color:var(--amber)}
  .rate.good{color:var(--brand)} .rate.good:hover{background:var(--brand-soft);border-color:var(--brand)}
  .rate.easy{color:var(--green)} .rate.easy:hover{background:var(--green-soft);border-color:var(--green)}
  .classic-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .done-card{text-align:center;padding:50px 24px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .done-card .big{font-size:52px;margin-bottom:10px}
  .done-card .t{font-size:22px;font-weight:700;margin-bottom:6px}
  .done-card .s{color:var(--muted);margin-bottom:22px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hidden{display:none!important}
  @media(max-width:560px){
    .flashcard .ftext{font-size:22px}
    .rate-row{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1 id="homeTitle" style="cursor:pointer">📚 My Flashcards</h1>
    <div class="spacer"></div>
    <div id="topActions"></div>
  </div>
  <div id="view"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   STORAGE  — IndexedDB wrapper (decks + cards, images inline)
============================================================ */
const DB_NAME='flashcards_db', DB_VER=1;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('decks')) db.createObjectStore('decks',{keyPath:'id'});
      if(!db.objectStoreNames.contains('cards')){
        const cs=db.createObjectStore('cards',{keyPath:'id'});
        cs.createIndex('deckId','deckId',{unique:false});
      }
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db)};
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(store,mode){return _db.transaction(store,mode).objectStore(store);}
function put(store,val){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>{ if(SYNC_ON&&(store==='decks'||store==='cards')) cloudUpsert(store,[store==='decks'?deckToRow(val):cardToRow(val)]); res(val);};r.onerror=()=>rej(r.error);});}
function del(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>{ if(SYNC_ON&&(store==='decks'||store==='cards')) cloudSoftDelete(store,key); res();};r.onerror=()=>rej(r.error);});}
function clearStore(store){return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function cardsByDeck(deckId){
  return new Promise((res,rej)=>{
    const idx=tx('cards','readonly').index('deckId');
    const r=idx.getAll(deckId);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ============================================================
   SPACED REPETITION  — SM-2 variant
   Card.srs = {ef, interval(days), reps, due(ms), lapses}
============================================================ */
function freshSRS(){return {ef:2.5,interval:0,reps:0,due:Date.now(),lapses:0};}
// quality: 0=Again,3=Hard,4=Good,5=Easy
function reviewSRS(srs,quality){
  srs=srs||freshSRS();
  const DAY=86400000;
  if(quality<3){
    srs.reps=0; srs.interval=0; srs.lapses=(srs.lapses||0)+1;
    srs.due=Date.now()+1000*60*10; // 10 min
  }else{
    srs.reps=(srs.reps||0)+1;
    if(srs.reps===1) srs.interval= quality===5?1:0.5*(quality===4?2:1) || 1;
    else if(srs.reps===2) srs.interval=6;
    else srs.interval=Math.round(srs.interval*srs.ef);
    if(srs.reps===1) srs.interval = quality===5?2:1;
    srs.ef=Math.max(1.3, srs.ef + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
    srs.due=Date.now()+srs.interval*DAY;
  }
  return srs;
}
function isDue(card){return !card.srs || (card.srs.due||0)<=Date.now();}
function dueCount(cards){return cards.filter(isDue).length;}

/* ============================================================
   STATE + ROUTER
============================================================ */
let DECKS=[], ALLCARDS=[], route={name:'home'};
async function loadDecks(){
  DECKS=await getAll('decks');
  DECKS.sort((a,b)=>b.createdAt-a.createdAt);
  ALLCARDS=await getAll('cards');
}
const parentOf=d=>d&&d.parentId?d.parentId:null;
function childDecks(parentId){return DECKS.filter(d=>parentOf(d)===(parentId||null));}
function descendantDeckIds(deckId,includeSelf){
  const ids=includeSelf?[deckId]:[];const stack=[deckId];
  while(stack.length){const p=stack.pop();for(const d of DECKS){if(parentOf(d)===p){ids.push(d.id);stack.push(d.id);}}}
  return ids;
}
function countsUnder(deckId){
  const ids=new Set(descendantDeckIds(deckId,true));let total=0,due=0;
  for(const c of ALLCARDS){if(ids.has(c.deckId)){total++;if(isDue(c))due++;}}
  return {total,due,folders:childDecks(deckId).length};
}
async function cardsUnder(deckId){
  const ids=new Set(descendantDeckIds(deckId,true));
  const all=await getAll('cards');
  return all.filter(c=>ids.has(c.deckId));
}
function deckById(id){return DECKS.find(d=>d.id===id);}
function crumbTrail(deck){const t=[];let d=deck;while(d){t.unshift(d);d=d.parentId?deckById(d.parentId):null;}return t;}

const $=s=>document.querySelector(s);
const view=$('#view'), topActions=$('#topActions');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

async function go(r){route=r;await render();}

async function render(){
  $('#modalRoot').innerHTML='';
  if(route.name==='home') return renderHome();
  if(route.name==='deck') return renderDeck(route.deckId);
  if(route.name==='study') return renderStudy(route.deckId,route.mode);
}

/* ---------- HOME ---------- */
function folderTileHTML(d){
  const c=countsUnder(d.id);
  const isContainer=c.folders>0;
  const modePill = isContainer? '<span class="pill classic" style="background:var(--brand-soft);color:var(--brand-ink)">FOLDER</span>'
    : (d.smart? '<span class="pill smart">SMART</span>':'<span class="pill classic">CLASSIC</span>');
  const duePill = (d.smart && c.due>0)? `<span class="pill due">${c.due} due</span>`:'';
  const meta = isContainer
    ? `${c.folders} folder${c.folders===1?'':'s'} · ${c.total} card${c.total===1?'':'s'}`
    : `${c.total} card${c.total===1?'':'s'}`;
  return `<button class="folder" onclick="go({name:'deck',deckId:'${d.id}'})">
      <div class="ftop"><div class="icon">${d.emoji||'📁'}</div>${modePill}</div>
      <div>
        <div class="fname">${esc(d.name)}</div>
        <div class="fmeta">${meta} ${duePill}</div>
      </div>
    </button>`;
}
async function renderHome(){
  const authBtn = SESSION
    ? `<button class="btn ghost sm" onclick="authMenu()" title="Synced across your devices">☁ ${esc((SESSION.user.email||'').split('@')[0])} ✓</button>`
    : `<button class="btn ghost sm" onclick="loginModal()" title="Sign in to sync across devices">☁ Sign in to sync</button>`;
  topActions.innerHTML=authBtn+`<button class="btn ghost sm" onclick="exportData()" title="Save a backup of everything">⬇ Backup</button>
    <button class="btn ghost sm" onclick="document.getElementById('importFile').click()" title="Import a backup or Quizlet export">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importData(this.files[0])">`;
  await loadDecks();
  const top=childDecks(null);
  let html='<div class="grid">';
  for(const d of top){
    html+=folderTileHTML(d);
  }
  html+=`<button class="add-folder" onclick="editDeck()"><span class="plus">+</span>New folder</button>`;
  html+='</div>';
  if(top.length===0){
    html=`<div class="empty-state"><div class="big">🗂️</div><div class="t">No folders yet</div>
      <div>Create a folder to start adding flashcards.</div>
      <div style="margin-top:20px"><button class="btn primary" onclick="editDeck()">+ Create your first folder</button></div></div>`;
  }
  view.innerHTML=html;
}

/* ---------- DECK ---------- */
async function renderDeck(deckId){
  await loadDecks();
  const deck=deckById(deckId);
  if(!deck){return go({name:'home'});}
  const subs=childDecks(deckId);
  const cards=await cardsByDeck(deckId);
  const agg=countsUnder(deckId);
  const parent=deck.parentId?deckById(deck.parentId):null;
  topActions.innerHTML=`<button class="btn ghost sm" onclick='go(${parent?`{name:"deck",deckId:"${parent.id}"}`:`{name:"home"}`})'>‹ ${parent?esc(parent.name):'All folders'}</button>`;

  const studyDisabled = agg.total===0;
  const smartBtnLabel = deck.smart? (agg.due>0?`Study ${agg.due} due`:'Review ahead'):`Study all (${agg.total})`;

  // Breadcrumb
  const trail=crumbTrail(deck);
  let crumb=`<div class="crumb" style="margin-bottom:14px"><button onclick="go({name:'home'})">🏠 Home</button>`;
  trail.forEach((t,i)=>{ crumb+=`<span>›</span>`;
    crumb+= i===trail.length-1
      ? `<span style="color:var(--text);font-weight:700">${esc(t.name)}</span>`
      : `<button onclick="go({name:'deck',deckId:'${t.id}'})">${esc(t.name)}</button>`; });
  crumb+='</div>';

  const statLine = subs.length>0
    ? `${agg.folders} folder${agg.folders===1?'':'s'} · ${agg.total} card${agg.total===1?'':'s'}${deck.smart&&agg.due>0?` · ${agg.due} due`:''}`
    : `${cards.length} card${cards.length===1?'':'s'}${deck.smart?` · ${agg.due} due now`:''}`;

  let html=crumb+`<div class="deckhead">
    <div class="row1">
      <div class="icon" style="width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:22px">${deck.emoji||'📁'}</div>
      <div style="flex:1">
        <div class="title">${esc(deck.name)}</div>
        <div class="stats">${statLine}</div>
      </div>

async function deleteDeck(deckId){

function sideEditor(side,label,f){
  return `<div class="cardside">
    <div class="sidelabel">${label}</div>
    <div class="field" style="margin-bottom:10px">
      <textarea id="${side}_text" placeholder="Type text here (optional)">${esc(f[side+'Text']||'')}</textarea>

    <input type="file" accept="image/*" id="${side}_file" class="hidden">
    <div id="${side}_preview"></div>
  </div>`;
}
const _imgState={};
function bindImg(side,existing){
  _imgState[side]=existing||'';
  const drop=$('#'+side+'_drop'), file=$('#'+side+'_file'), prev=$('#'+side+'_preview');
  const showPrev=()=>{
    if(_imgState[side]){
      prev.innerHTML=`<div class="img-preview"><img src="${_imgState[side]}"><button class="rm" onclick="clearImg('${side}')">✕</button></div>`;
      drop.style.display='none';
    }else{prev.innerHTML='';drop.style.display='';}
  };
  drop.onclick=()=>file.click();
  file.onchange=async()=>{
    const fl=file.files[0];if(!fl)return;
    _imgState[side]=await compressImage(fl);showPrev();
  };
  window['clearImg']=(s)=>{_imgState[s]='';const d=$('#'+s+'_drop'),p=$('#'+s+'_preview');p.innerHTML='';d.style.display='';};
  showPrev();
}
function compressImage(file,max=900,quality=.82){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveCard(deckId,cardId,another){
  const ft=$('#front_text').value.trim(), bt=$('#back_text').value.trim();

  if(cardId){

    existing.frontText=ft;existing.frontImage=fi;existing.backText=bt;existing.backImage=bi;

    await put('cards',{id:uid(),deckId,frontText:ft,frontImage:fi,backText:bt,backImage:bi,srs:freshSRS(),createdAt:Date.now()});

let study=null;
async function renderStudy(deckId,mode){
  const deck=DECKS.find(d=>d.id===deckId)||(await getAll('decks')).find(d=>d.id===deckId);
  let cards=await cardsUnder(deckId);
  topActions.innerHTML=`<button class="btn ghost sm" onclick="go({name:'deck',deckId:'${deckId}'})">✕ End session</button>`;
  if(mode==='smart'){
    let due=cards.filter(isDue);
    if(due.length===0) due=cards.slice(); // review ahead if nothing due
    due.sort((a,b)=>(a.srs?.due||0)-(b.srs?.due||0));
    cards=due;
  }else{
    cards=shuffle(cards.slice());
  }
  study={deckId,mode,queue:cards,idx:0,total:cards.length,flipped:false,revealed:false,again:0,known:0,reinsertGap:3};
  drawStudy();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function drawStudy(){
  const s=study;
  if(s.idx>=s.queue.length){return drawDone();}
  const c=s.queue[s.idx];
  const faceText = s.flipped? c.backText : c.frontText;
  const faceImg = s.flipped? c.backImage : c.frontImage;
  const faceLabel = s.flipped? 'Definition / Back':'Word / Front';
  const pct = s.total? Math.round((s.idx)/s.total*100):0;

  let face=`<div class="flashcard" onclick="flip()">
    <div class="face-label">${faceLabel}</div>`;
  // On the answer (back) side, show the word it corresponds to as a header
  if(s.flipped && c.frontText) face+=`<div style="font-size:15px;font-weight:800;color:var(--brand);letter-spacing:.01em;margin-bottom:2px">${esc(c.frontText)}</div>`;
  if(faceImg) face+=`<img src="${faceImg}" alt="">`;
  if(faceText) face+=`<div class="ftext"${s.flipped?' style="font-size:22px"':''}>${esc(faceText)}</div>`;
  if(!faceImg&&!faceText) face+=`<div class="ftext" style="color:#b6bcc6">(empty)</div>`;
  face+=`<div class="hint">↔ Click to flip</div></div>`;

  let controls='';
  if(!s.revealed){
    controls=`<div style="text-align:center;margin-top:18px"><button class="btn primary" onclick="flip()">Show answer</button></div>`;
  }else if(s.mode==='smart'){
    controls=`<div class="rate-row">
      <button class="rate again" onclick="rate(0)">Again<span class="sub">&lt;10 min</span></button>
      <button class="rate hard" onclick="rate(3)">Hard<span class="sub">soon</span></button>
      <button class="rate good" onclick="rate(4)">Good<span class="sub">${nextLabel(4)}</span></button>
      <button class="rate easy" onclick="rate(5)">Easy<span class="sub">${nextLabel(5)}</span></button>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px">Rate how well you knew it — weak cards come back sooner.</div>`;
  }else{
    controls=`<div class="classic-row">
      <button class="rate again" onclick="classicNext(false)">↺ Didn't know</button>
      <button class="rate easy" onclick="classicNext(true)">✓ Got it</button>
    </div>`;
  }

  view.innerHTML=`<div class="study-wrap">
    <div class="study-top">
      <span class="study-count">${Math.min(s.idx+1,s.total)} / ${s.total}</span>
      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      <span class="study-count">${s.mode==='smart'?'🧠 Smart':'🔁 Classic'}</span>
    </div>
    ${face}
    ${controls}
  </div>`;
}
function nextLabel(q){
  const c=study.queue[study.idx];
  const sim=reviewSRS(JSON.parse(JSON.stringify(c.srs||freshSRS())),q);
  const days=sim.interval;
  if(days<1)return '~1 day';
  if(days===1)return '1 day';
  if(days<30)return days+' days';
  const m=Math.round(days/30);return m+' mo';
}
function flip(){study.flipped=!study.flipped; if(study.flipped)study.revealed=true; drawStudy();}

async function rate(q){
  const c=study.queue[study.idx];
  c.srs=reviewSRS(c.srs||freshSRS(),q);
  await put('cards',c);
  if(q<3){study.again++; // requeue near the end of this session
    const copy=c; study.queue.push(copy);
  }else{study.known++;}
  study.idx++;study.flipped=false;study.revealed=false;drawStudy();
}
function classicNext(known){
  if(known)study.known++;
  else{study.again++;study.queue.push(study.queue[study.idx]);}
  study.idx++;study.flipped=false;study.revealed=false;drawStudy();
}
function drawDone(){
  const s=study;
  topActions.innerHTML='';
  view.innerHTML=`<div class="study-wrap"><div class="done-card">
    <div class="big">🎉</div>
    <div class="t">Session complete!</div>
    <div class="s">${s.known} known · ${s.again} need more practice${s.mode==='smart'?'<br>Smart engine updated your review schedule.':''}</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="go({name:'study',deckId:'${s.deckId}',mode:'${s.mode}'})">Study again</button>
      <button class="btn primary" onclick="go({name:'deck',deckId:'${s.deckId}'})">Back to folder</button>
    </div>
  </div></div>`;
}

async function exportData(){
  await loadDecks();
  const out={app:'myflashcards',version:1,exportedAt:Date.now(),decks:[]};
  for(const d of DECKS){
    const cards=await cardsByDeck(d.id);
    out.decks.push({
      id:d.id, parentId:d.parentId||null, name:d.name, emoji:d.emoji||'📁', smart:!!d.smart,
      cards:cards.map(c=>({frontText:c.frontText||'',frontImage:c.frontImage||'',backText:c.backText||'',backImage:c.backImage||''}))
    });
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='my-flashcards-backup.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup saved');
}
async function importData(file){
  if(!file)return;
  let data;
  try{ data=JSON.parse(await file.text()); }catch(e){ toast('That file isn\'t valid JSON');return; }
  // Accept our backup format, or a generic {decks:[...]} shape
  const decks = Array.isArray(data)?data:(data.decks||[]);
  if(!decks.length){toast('No folders found in that file');return;}
  let totalCards=0;
  const idMap={}; const base=Date.now();
  // First pass: assign new ids (preserves hierarchy if the backup had ids)
  decks.forEach(d=>{ if(d.id) idMap[d.id]=uid(); });
  for(let i=0;i<decks.length;i++){
    const d=decks[i];
    const deckId=idMap[d.id]||uid();
    const parentId=(d.parentId&&idMap[d.parentId])?idMap[d.parentId]:null;
    await put('decks',{id:deckId,name:d.name||'Imported',emoji:d.emoji||'🧠',smart:d.smart!==false,parentId,createdAt:base-i});
    const cards=d.cards||[];
    for(const c of cards){
      await put('cards',{
        id:uid(),deckId,
        frontText:c.frontText||c.front||'',frontImage:c.frontImage||'',
        backText:c.backText||c.back||'',backImage:c.backImage||'',
        srs:freshSRS(),createdAt:Date.now()
      });
      totalCards++;
    }
  }
  await loadDecks();renderHome();
  toast('Imported '+decks.length+' folder'+(decks.length===1?'':'s')+' · '+totalCards+' cards');

 "", "backText": "unchanging over time or unable to be changed.", "backImage": ""}, {"frontText": "indefatigable", "frontImage": "", "backText": "(of a person or their efforts) persisting tirelessly.", "backImage": ""}, {"frontText": "indolent", "frontImage": "", "backText": "1. wanting to avoid activity or exertion; lazy.\n2. (of a disease or condition) causing little or no pain.", "backImage": ""}, {"frontText": "insular", "frontImage": "", "backText": "ignorant of or uninterested in cultures, ideas, or peoples outside one's own experience.", "backImage": ""}, {"frontText": "intransigent", "frontImage": "", "backText": "unwilling or refusing to change one's views or to agree about something.", "backImage": ""}, {"frontText": "intrepid", "frontImage": "", "backText": "fearless; adventurous (often used for rhetorical or humorous effect).", "backImage": ""}, {"frontText": "irreverent", "frontImage": "", "backText": "showing a lack of respect for people or things that are generally taken seriously.", "backImage": ""}, {"frontText": "loathe", "frontImage": "", "backText": "feel intense dislike or disgust for.", "backImage": ""}, {"frontText": "malign", "frontImage": "", "backText": "1. evil in nature or effect.\n2. speak about (someone) in a spitefully critical manner.", "backImage": ""}, {"frontText": "malleable", "frontImage": "", "backText": "easily influenced; pliable.", "backImage": ""}, {"frontText": "neophyte", "frontImage": "", "backText": "1. a person who is new to a subject or activity.\n2. a new convert to a religion.", "backImage": ""}, {"frontText": "plastic", "frontImage": "", "backText": "1. not genuine; artificial or unnatural.\n2. (of a substance or material) easily shaped or moulded.", "backImage": ""}, {"frontText": "platitude", "frontImage": "", "backText": "Definition: a remark or statement that is overused, dull, and lacks originality.\n\nExamples:\n• His speech was filled with empty platitudes about \"working together.\"", "backImage": ""}, {"frontText": "prescient", "frontImage": "", "backText": "having or showing knowledge of events before they take place.", "backImage": ""}, {"frontText": "pristine", "frontImage": "", "backText": "in its original condition; unspoilt.", "backImage": ""}, {"frontText": "reproach", "frontImage": "", "backText": "express to (someone) one's disapproval of or disappointment in their actions.", "backImage": ""}, {"frontText": "robust", "frontImage": "", "backText": "1. strong and healthy; vigorous.\n2. (of wine or food) strong and rich in flavour or smell.", "backImage": ""}, {"frontText": "salubrious", "frontImage": "", "backText": "1. health-giving; healthy.\n2. (of a place) pleasant; not run-down.", "backImage": ""}, {"frontText": "sanction", "frontImage": "", "backText": "1. a threatened penalty for disobeying a law or rule.\n2. official permission or approval for an action.", "backImage": ""}, {"frontText": "sedulous", "frontImage": "", "backText": "(of a person or action) showing dedication and diligence.", "backImage": ""}, {"frontText": "soporific", "frontImage": "", "backText": "tending to induce drowsiness or sleep.", "backImage": ""}, {"frontText": "stern", "frontImage": "", "backText": "(of a person or their manner) serious and unrelenting, especially in the assertion of authority and exercise of discipline.", "backImage": ""}, {"frontText": "tendentious", "frontImage": "", "backText": "expressing or intending to promote a particular cause or point of view, especially a controversial one.", "backImage": ""}]}, {"name": "Set 8", "emoji": "🧠", "smart": true, "cards": [{"frontText": "accentuate", "frontImage": "", "backText": "make more noticeable or prominent.", "backImage": ""}, {"frontText": "conjectural", "frontImage": "", "backText": "Definition: based on guesswork, speculation, or incomplete evidence.\n\nExamples:\n\n• His theory was purely conjectural and lacked solid proof.", "backImage": ""}, {"frontText": "convivial", "frontImage": "", "backText": "friendly, lively, and enjoyable.", "backImage": ""}, {"frontText": "decadent", "frontImage": "", "backText": "characterized by or reflecting a state of moral or cultural decline.", "backImage": ""}, {"frontText": "egregious", "frontImage": "", "backText": "outstandingly bad; shocking.", "backImage": ""}, {"frontText": "evanescent", "frontImage": "", "backText": "soon passing out of sight, memory, or existence; quickly fading or disappearing.", "backImage": ""}, {"frontText": "flamboyant", "frontImage": "", "backText": "1. (of a person or their behaviour) tending to attract attention because of their exuberance, confidence, and stylishness.\n2. bright, colourful, and very noticeable.", "backImage": ""}, {"frontText": "forestall", "frontImage": "", "backText": "prevent or obstruct (an anticipated event or action) by taking advance action.", "backImage": ""}, {"frontText": "gainsay", "frontImage": "", "backText": "deny or contradict (a fact or statement).", "backImage": ""}, {"frontText": "galvanize", "frontImage": "", "backText": "1. shock or excite (someone) into taking action.\n2. coat (iron or steel) with a protective layer of zinc.", "backImage": ""}, {"frontText": "indiscriminate", "frontImage": "", "backText": "done at random or without careful judgement.", "backImage": ""}, {"frontText": "innocuous", "frontImage": "", "backText": "not harmful or offensive.", "backImage": ""}, {"frontText": "momentary", "frontImage": "", "backText": "lasting for a very short time; brief.", "backImage": ""}, {"frontText": "mundane", "frontImage": "", "backText": "1. lacking interest or excitement; dull.\n2. of this earthly world rather than a heavenly or spiritual one.", "backImage": ""}, {"frontText": "nettlesome", "frontImage": "", "backText": "causing annoyance or difficulty.", "backImage": ""}, {"frontText": "nullify", "frontImage": "", "backText": "make legally null and void; invalidate.", "backImage": ""}, {"frontText": "obviate", "frontImage": "", "backText": "Definition: to remove, prevent, or avoid a need or difficulty.\nExamples:\n\n• Careful planning can obviate the need for last-minute changes.", "backImage": ""}, {"frontText": "omnipresent", "frontImage": "", "backText": "widely or constantly encountered; widespread.", "backImage": ""}, {"frontText": "oust", "frontImage": "", "backText": "drive out or expel (someone) from a position or place.", "backImage": ""}, {"frontText": "palpable", "frontImage": "", "backText": "1. (of a feeling or atmosphere) so intense as to seem almost tangible.\n2. able to be touched or felt.", "backImage": ""}, {"frontText": "perfidy", "frontImage": "", "backText": "Definition: deceitfulness; betrayal of trust.\n\nExamples:\n\n• She could never forgive his perfidy in breaking their agreement.", "backImage": ""}, {"frontText": "profuse", "frontImage": "", "backText": "Definition: given, produced, or existing in large amounts; abundant, excessive.\n\nExamples:\n• She offered profuse thanks to the volunteers.", "backImage": ""}, {"frontText": "pugnacious", "frontImage": "", "backText": "eager or quick to argue, quarrel, or fight.", "backImage": ""}, {"frontText": "sagacious", "frontImage": "", "backText": "having or showing keen mental discernment and good judgement; wise or shrewd.", "backImage": ""}, {"frontText": "sanguine", "frontImage": "", "backText": "optimistic or positive, especially in an apparently bad or difficult situation.", "backImage": ""}, {"frontText": "scant", "frontImage": "", "backText": "Definition: barely sufficient in amount or quantity; meager.\n\nExamples:\n• They paid scant attention to the warnings.", "backImage": ""}, {"frontText": "skulduggery", "frontImage": "", "backText": "Definition: underhanded or dishonest behavior; trickery.\n\nExample:\n• He was known for business deals full of skullduggery.", "backImage": ""}, {"frontText": "trivial", "frontImage": "", "backText": "of little value or importance.", "backImage": ""}, {"frontText": "utilitarian", "frontImage": "", "backText": "1. designed to be useful or practical rather than attractive.\n2. relating to or adhering to the doctrine of utilitarianism.", "backImage": ""}, {"frontText": "vapid", "frontImage": "", "backText": "offering nothing that is stimulating or challenging; bland.", "backImage": ""}]}, {"name": "Set 9", "emoji": "🧠", "smart": true, "cards": [{"frontText": "boorish", "frontImage": "", "backText": "rough and bad-mannered; coarse.", "backImage": ""}, {"frontText": "brook", "frontImage": "", "backText": "to tolerate; to endure; to countenance", "backImage": ""}, {"frontText": "circumspect", "frontImage": "", "backText": "wary and unwilling to take risks.", "backImage": ""}, {"frontText": "comity", "frontImage": "", "backText": "1. an association of nations for their mutual benefit.\n2. courtesy and considerate behavior towards others.", "backImage": ""}, {"frontText": "commensurate", "frontImage": "", "backText": "corresponding in size or degree; in proportion.", "backImage": ""}, {"frontText": "cordial", "frontImage": "", "backText": "1. warm and friendly.\n2. strongly felt.", "backImage": ""}, {"frontText": "deleterious", "frontImage": "", "backText": "causing harm or damage.", "backImage": ""}, {"frontText": "dichotomy", "frontImage": "", "backText": "a division or contrast between two things that are or are represented as being opposed or entirely different.", "backImage": ""}, {"frontText": "edify", "frontImage": "", "backText": "instruct or improve (someone) morally or intellectually.", "backImage": ""}, {"frontText": "elicit", "frontImage": "", "backText": "evoke or draw out (a reaction, answer, or fact) from someone.", "backImage": ""}, {"frontText": "erudite", "frontImage": "", "backText": "having or showing great knowledge or learning.", "backImage": ""}, {"frontText": "fecund", "frontImage": "", "backText": "producing or capable of producing an abundance of offspring or new growth; highly fertile.", "backImage": ""}, {"frontText": "feeble", "frontImage": "", "backT ts or aspects.", "backImage": ""}, {"frontText": "repudiate", "frontImage": "", "backText": "1. refuse to accept; reject.\n2. deny the truth or validity of.", "backImage": ""}, {"frontText": "tact", "frontImage": "", "backText": "skill and sensitivity in dealing with others or with difficult issues.", "backImage": ""}, {"frontText": "trifling", "frontImage": "", "backText": "unimportant or trivial.", "backImage": ""}, {"frontText": "turbulent", "frontImage": "", "backText": "characterized by conflict, disorder, or confusion; not stable or calm.", "backImage": ""}]}, {"name": "Set 10", "emoji": "🧠", "smart": true, "cards": [{"frontText": "acumen", "frontImage": "", "backText": "the ability to make good judgments and take quick decisions.", "backImage": ""}, {"frontText": "antithesis", "frontImage": "", "backText": "1. a person or thing that is the direct opposite of someone or something else.\n2. (in Hegelian philosophy) the negation of the thesis as the second stage in the process of dialectical reasoning.", "backImage": ""}, {"frontText": "ascribe", "frontImage": "", "backText": "regard something as being due to (a cause)./assign", "backImage": ""}, {"frontText": "befuddled", "frontImage": "", "backText": "cause to become unable to think clearly.", "backImage": ""}, {"frontText": "eschew", "frontImage": "", "backText": "deliberately avoid using; abstain from.", "backImage": ""}, {"frontText": "esoteric", "frontImage": "", "backText": "intended for or likely to be understood by only a small number of people with a specialized knowledge or interest.", "backImage": ""}, {"frontText": "evasive", "frontImage": "", "backText": "tending to avoid commitment or self-revelation, especially by responding only indirectly.", "backImage": ""}, {"frontText": "exculpate", "frontImage": "", "backText": "show or declare that (someone) is not guilty of wrongdoing.", "backImage": ""}, {"frontText": "expedite", "frontImage": "", "backText": "make (an action or process) happen sooner or be accomplished more quickly.", "backImage": ""}, {"frontText": "fastidious", "frontImage": "", "backText": "very attentive to and concerned about accuracy and detail.", "backImage": ""}, {"frontText": "feign", "frontImage": "", "backText": "pretend to be affected by (a feeling, state, or injury).", "backImage": ""}, {"frontText": "furtive", "frontImage": "", "backText": "attempting to avoid notice or attention, typically because of guilt or a belief that discovery would lead to trouble; secretive.", "backImage": ""}, {"frontText": "hamper", "frontImage": "", "backText": "1. hinder or impede the movement or progress of.\n2. a basket with a carrying handle and a hinged lid, used for food, cutlery, and plates on a picnic.", "backImage": ""}, {"frontText": "indispensable", "frontImage": "", "backText": "absolutely necessary.", "backImage": ""}, {"frontText": "lament", "frontImage": "", "backText": "a passionate expression of grief or sorrow.", "backImage": ""}, {"frontText": "myopic", "frontImage": "", "backText": "1. short-sighted.\n2. lacking foresight or intellectual insight.", "backImage": ""}, {"frontText": "nonchalant", "frontImage": "", "backText": "(of a person or manner) feeling or appearing casually calm and relaxed; not displaying anxiety, interest, or enthusiasm.", "backImage": ""}, {"frontText": "partial", "frontImage": "", "backText": "1. existing only in part; incomplete.\n2. favoring one side in a dispute above the other; biased.\n3. having a liking for.", "backImage": ""}, {"frontText": "pensive", "frontImage": "", "backText": "engaged in, involving, or reflecting deep or serious thought.", "backImage": ""}, {"frontText": "portend", "frontImage": "", "backText": "be a sign of warning that (something, especially something momentous or calamitous) is likely to happen.", "backImage": ""}, {"frontText": "provincial", "frontImage": "", "backText": "1. of or concerning a province of a country or empire.\n2. of or concerning the regions outside the capital city of a country, especially when regarded as unsophisticated or narrow-minded.", "backImage": ""}, {"frontText": "rudimentary", "frontImage": "", "backText": "Definition:\n\nbasic, simple, or undeveloped; involving only the most essential or elementary parts.\n\nExamples:\n• She only has a rudimentary knowledge of Spanish.", "backImage": ""}, {"frontText": "salutary", "frontImage": "", "backText": "Definition:\n\nproducing good effects; beneficial, often in a corrective or healthful way.\n\nExamples:\n\n• A brisk walk has salutary effects on mental health.", "backImage": ""}, {"frontText": "sever", "frontImage": "", "backText": "1. divide by cutting or slicing, especially suddenly and forcibly.\n2. put an end to (a connection or relationship); break off.", "backImage": ""}, {"frontText": "slight", "frontImage": "", "backText": "1. insult (someone) by treating or speaking of them without proper respect or attention.\n2. small in degree; inconsiderable.\n3. (of a person or their build) not sturdy; thin or slender.", "backImage": ""}, {"frontText": "somnolent", "frontImage": "", "backText": "sleepy; drowsy.", "backImage": ""}, {"frontText": "stoic", "frontImage": "", "backText": "1. a person who can endure pain or hardship without showing their feelings or complaining.\n2. a member of the ancient philosophical school of Stoicism.", "backImage": ""}, {"frontText": "supersede", "frontImage": "", "backText": "take the place of (a person or thing previously in authority or use); supplant.", "backImage": ""}, {"frontText": "tout", "frontImage": "", "backText": "1. attempt to sell (something), typically by a direct or persistent approach.\n2. attempt to persuade people of the merits of.", "backImage": ""}, {"frontText": "wane", "frontImage": "", "backText": "Definition: to decrease gradually in size, strength, intensity, or power.\n\nExamples:\n• His influence began to wane after the scandal.", "backImage": ""}]}, {"name": "Set 11", "emoji": "🧠", "smart": true, "cards": [{"frontText": "abhor", "frontImage": "", "backText": "regard with disgust and hatred.", "backImage": ""}, {"frontText": "boisterous", "frontImage": "", "backText": "1. noisy, energetic, and cheerful.\n2. (of weather or water) wild or stormy.", "backImage": ""}, {"frontText": "chivalrous", "frontImage": "", "backText": "1. (of a man or his behaviour) courteous and gallant, especially towards women. 2. relating to the historical concept of chivalry.", "backImage": ""}, {"frontText": "churlish", "frontImage": "", "backText": "rude in a mean-spirited and surly way.", "backImage": ""}, {"frontText": "clandestine", "frontImage": "", "backText": "kept secret or done secretively, especially because illicit.", "backImage": ""}, {"frontText": "complacent", "frontImage": "", "backText": "showing smug or uncritical satisfaction with oneself or one's achievements.", "backImage": ""}, {"frontText": "cumbersome", "frontImage": "", "backText": "1. large or heavy and therefore difficult to carry or use; unwieldy.\n2. slow or complicated and therefore inefficient.", "backImage": ""}, {"frontText": "debilitating", "frontImage": "", "backText": "make (someone) very weak and infirm.", "backImage": ""}, {"frontText": "deliberate", "frontImage": "", "backText": "done consciously and intentionally.", "backImage": ""}, {"frontText": "droll", "frontImage": "", "backText": "curious or unusual in a way that provokes dry amusement.", "backImage": ""}, {"frontText": "eccentric", "frontImage": "", "backText": "(of a person or their behavior) unconventional and slightly strange.", "backImage": ""}, {"frontText": "fractious", "frontImage": "", "backText": "1. (typically of children) irritable and quarrelsome.\n2. (of a group or organization) difficult to control; unruly.", "backImage": ""}, {"frontText": "limpid", "frontImage": "", "backText": "1. completely clear and transparent.\n2. (especially of writing or music) clear and accessible or melodious.", "backImage": ""}, {"frontText": "mawkish", "fro  or resentment by drawing oneself up.\n\nExample Sentences:\n1. She tried to bridle her impatience during the long meeting.\n\nSynonyms: restrain, curb, control, check, rein in, hold back", "backImage": ""}, {"frontText": "comply", "frontImage": "", "backText": "act in accordance with a wish or command.", "backImage": ""}, {"frontText": "crestfallen", "frontImage": "", "backText": "sad and disappointed.", "backImage": ""}, {"frontText": "curtail", "frontImage": "", "backText": "reduce in extent or quantity; impose a restriction on.", "backImage": ""}, {"frontText": "elucidate", "frontImage": "", "backText": "make (something) clear; explain.", "backImage": ""}, {"frontText": "evade", "frontImage": "", "backText": "escape or avoid (someone or something), especially by guile or trickery.", "backImage": ""}, {"frontText": "feckless", "frontImage": "", "backText": "lacking initiative or strength of character; irresponsible.", "backImage": ""}, {"frontText": "fester", "frontImage": "", "backText": "1. (of a wound or sore) become septic; suppurate.\n2. (of a negative feeling or a problem) become worse or more intense, especially through long-term neglect or indifference.", "backImage": ""}, {"frontText": "iconoclastic", "frontImage": "", "backText": "criticizing or attacking cherished beliefs or institutions.", "backImage": ""}, {"frontText": "immure", "frontImage": "", "backText": "enclose or confine (someone) against their will.", "backImage": ""}, {"frontText": "improvise", "frontImage": "", "backText": "1. create and perform (music, drama, or verse) spontaneously or without preparation.\n2. produce or make (something) from whatever is available.", "backImage": ""}, {"frontText": "inhibit", "frontImage": "", "backText": "1. hinder, restrain, or prevent (an action or process).\n2. make (someone) self-conscious and unable to act in a relaxed and natural way.\n3. (in ecclesiastical law) forbid (a member of the clergy) to exercise clerical functions.", "backImage": ""}, {"f "frontText": "superfluous", "frontImage": "", "backText": "unnecessary, especially through being more than enough.", "backImage": ""}, {"frontText": "synoptic", "frontImage": "", "backText": "Definition: Giving a general overview or summary of something; presenting a broad, comprehensive perspective rather than detailed specifics.\n\nExample Sentences:\n\nHer report provided a synoptic view of the company's performance over the last decade.\n\nSynonyms: summary, concise, overarching, general, broad, comprehensive, condensed", "backImage": ""}, {"frontText": "thorough", "frontImage": "", "backText": "complete with regard to every detail; not superficial or partial.", "backImage": ""}, {"frontText": "visionary", "frontImage": "", "backText": "1. thinking about or planning the future with imagination or wisdom.\n2. relating to or having the ability to see visions in a dream or trance, or as a supernatural apparition.", "backImage": ""}, {"frontText": "vociferous", "frontImage": "", "backText": "Definition: Expressing feelings or opinions in a loud and forceful way; clamorous and outspoken.\n\nExample Sentences:\n\nThe vociferous crowd demanded immediate action.\n\nSynonyms: loud, outspoken, vehement, insistent, clamorous, boisterous, strident", "backImage": ""}]}, {"name": "Set 17", "emoji": "🧠", "smart": true, "cards": [{"frontText": "acclaim", "frontImage": "", "backText": "praise enthusiastically and publicly.", "backImage": ""}, {"frontText": "ascertain", "frontImage": "", "backText": "find (something) out for certain; make sure of.", "backImage": ""}, {"frontText": "assertive", "frontImage": "", "backText": "having or showing a confident and forceful personality.", "backImage": ""}, {"frontText": "bogus", "frontImage": "", "backText": "not genuine or true (used in a disapproving manner when deception has been attempted).", "backImage": ""}, {"frontText": "cataclysmic", "frontImage": "", "backText": "(of a natural event) large-scale and violent.", "backImage": ""}, {"frontText": "circumscribe", "frontImage": "", "backText": "restrict (something) within limits.", "backImage": ""}, {"frontText": "complementary", "frontImage": "", "backText": "combining in such a way as to enhance or emphasize the qualities of each other or another.", "backImage": ""}, {"frontText": "contentious", "frontImage": "", "backText": "causing or likely to cause an argument; controversial.", "backImage": ""}, {"frontText": "disingenuous", "frontImage": "", "backText": "not candid or sincere, typically by pretending that one knows less about something than one really does.", "backImage": ""}, {"frontText": "divulge", "frontImage": "", "backText": "make known (private or sensitive information).", "backImage": ""}, {"frontText": "dogmatic", "frontImage": "", "backText": "Definition: Asserting opinions or beliefs in an authoritative or arrogant way, often without considering evidence or other viewpoints; inflexibly committed to a set of principles.\n\nExample Sentences:\n\nHis dogmatic approach to politics left no room for discussion or compromise.\n\nSynonyms: opinionated, inflexible, rigid, authoritarian, doctrinaire, uncompromising", "backImage": ""}, {"frontText": "fallacious", "frontImage": "", "backText": "Definition: Based on a mistaken belief or faulty reasoning; misleading or deceptive.\n\nExample Sentences:\n\nThe argument was fallacious, relying on false assumptions rather than evidence.\n\nSynonyms: misleading, deceptive, false, erroneous, faulty, illogical, unsound", "backImage": ""}, {"frontText": "foolhardy", "frontImage": "", "backText": "recklessly bold or rash.", "backImage": ""}, {"frontText": "hinder", "frontImage": "", "backText": "make it difficult for (someone) to do something or for (something) to happen.", "backImage": ""}, {"frontText": "impair", "frontImage": "", "backText": "weaken or damage (something, especially a faculty or function).", "backImage": ""}, {"frontText": "impugn", "frontImage": "", "backText": "Definition: To challenge or attack the truth, validity, or reputation of something or someone, often in a critical or questioning way.\n\nExample Sentences:\n\nThe lawyer sought to impugn the witness’s credibility during cross-examination.\n\nSynonyms: challenge, question, dispute, criticize, attack, cast doubt on, call into question", "backImage": ""}, {"frontText": "incessant", "frontImage": "", "backText": "(of something regarded as unpleasant) continuing without pause or interruption.", "backImage": ""}, {"frontText": "inclined", "frontImage": "", "backText": "1. be favorably disposed towards or willing to do something.\n2. have a tendency to do something.\n3. lean or turn away from a given plane or direction, especially the vertical or horizontal.", "backImage": ""}, {"frontText": "inveterate", "frontImage": "", "backText": "having a particular habit, activity, or interest that is long-established and unlikely to change.", "backImage": ""}, {"frontText": "miserly", "frontImage": "", "backText": "1. of or characteristic of a miser.\n2. (of a quantity) pitiably small or inadequate.", "backImage": ""}, {"frontText": "patent", "frontImage": "", "backText": "Definition:\n\n(adjective) Obvious, clear, or easily recognizable.\n\n(noun) A government license granting exclusive rights to make, use, or sell an invention for a certain period.\n\n(verb) To obtain such a license for an invention.\n\nExample Sentences:\n\nIt was a patent lie that no one believed.\n\nSynonyms (adj.): obvious, clear, evident, unmistakable, blatant, manifest", "backImage": ""}, {"frontText": "petulant", "frontImage": "", "backText": "(of a person or their manner) childishly sulky or bad-tempered.", "backImage": ""}, {"frontText": "pithy", "frontImage": "", "backText": "Definition: Concise and meaningful; brief but full of substance or impact.\n\nExample Sentences:\n\nThe speaker’s pithy remarks captured the audience’s attention immediately.\n\nSynonyms: concise, succinct, terse, brief, to the point, impactful, meaningful", "backImage": ""}, {"frontText": "pliant", "frontImage": "", "backText": "1. easily bent.\n2. easily influenced or directed; yielding.", "backImage": ""}, {"frontText": "sanctimonious", "frontImage": "", "backText": "making a show of being morally superior to other people.", "backImage": ""}, {"frontText": "sound", "frontImage": "", "backText": "1. vibrations that travel through the air or another medium and can be heard when they reach a person's or animal's ear.\n2. an idea or impression conveyed by words.\n3. in good condition; not damaged, injured, or diseased.", "backImage": ""}, {"frontText": "tarnish", "frontImage": "", "backText": "1. damage or harm done to something.\n2. dullness of color; loss of brightness.", "backImage": ""}, {"frontText": "tepid", "frontImage": "", "backText": "1. (especially of a liquid) only slightly warm; lukewarm.\n2. showing little enthusiasm.", "backImage": ""}, {"frontText": "upbraid", "frontImage": "", "backText": "find fault with (someone); scold.", "backImage": ""}, {"frontText": "vexation", "frontImage": "", "backText": "the state of being annoyed, frustrated, or worried.", "backImage": ""}]}, {"name": "Set 18", "emoji": "🧠", "smart": true, "cards": [{"frontText": "abet", "frontImage": "", "backText": "encourage or assist (someone) to do something wrong, in particular to commit a crime.", "backImage": ""}, {"frontText": "accessible", "frontImage": "", "backText": "1. (of a place) able to be reached or entered.\n2. (of a person, especially one in a position of authority) friendly and easy to talk to; approachable.", "backImage": ""}, {"frontText": "acquisitive", "frontImage": "", "backText": "Definition: Having a strong desire to acquire and own things, often focused on wealth, possessions, or power.\n\nSynonyms: greedy, materialistic, grasping, covetous, avaricious, possessive", "backImage": ""}, {"frontText": "amalgamate", "frontImage": "", "backText": "combine or unite to form one organization or structure.", "backImage": ""}, {"frontText": "attenuate", "frontImage": "", "backText": "Definition:\n\nTo make something weaker, thinner, or less intense in force, effect, or value.\n\nExample Sentences:\n\nThe walls are designed to attenuate noise from outside.\n\nSynonyms: weaken, reduce, lessen, diminish, dilute, soften, thin", "backImage": ""}, {"frontText": "augment", "frontImage": "", "backText": "make (something) greater by adding to it; increase.", "backImage": ""}, {"frontText": "aversion", "frontImage": "", "backText": "a strong dislike or disinclination.", "backImage": ""}, {"frontText": "blithe", "frontImage": "", "backText": "Definition:\n\n- Showing a cheerful and carefree attitude.\n\n- Sometimes used negatively to mean showing a lack of proper concern; casually indifferent.\n\nSynonyms: carefree, cheerful, lighthearted, unconcerned, indifferent, nonchalant", "backImage": ""}, {"frontText": "contempt", "frontImage": "", "backText": "the feeling that a person or a thing is worthless or beneath consideration.", "backImage": ""}, {"frontText": "dawdle", "frontImage": "", "backText": "waste time; be slow.", "backImage": ""}, {"frontText": "deflect", "frontImage": "", "backText": "1. cause (something) to change direction; turn aside from a straight course.\n2. cause (someone) to deviate from an intended purpose.", "backImage": ""}, {"frontText": "discount", "frontImage": "", "backText": "Definition:\n\n(verb – figurative) To regard something as unimportant, not credible, or unlikely; to dismiss.\n\n(noun) A reduction from the usual cost of something.", "backImage": ""}, {"frontText": "dissident", "frontImage": "", "backText": "a person who opposes official policy, especially that of an authoritarian state.", "backImage": ""}, {"frontText": "efficacious", "frontImage": "", "backText": "(of something inanimate or abstract) successful in producing a desired or intended result; effective.", "backImage": ""}, {"frontText": "equitable", "frontImage": "", "backText": "fair and impartial.", "backImage": ""}, {"frontText": "erratic", "frontImage": "", "backText": "not even or regular in pattern or movement; unpredictable.", "backImage": ""}, {"frontText": "industrious", "frontImage": "", "backText": "diligent and hard-working.", "backImage": ""}, {"frontText": "inform", "frontImage": "", "backText": "1. give (someone) facts or information; tell.\n2. give an essential or formative principle or quality to.", "backImage": ""}, {"frontText": "irksome", "frontImage": "", "backText": "irritating; annoying.", "backImage": ""}, {"frontText": "manacle", "frontImage": "", "backText": "Definition:\n\n(noun) A handcuff or shackle used to restrain someone’s hands.\n\n(verb) To restrain or limit someone, either physically (with manacles) or figuratively (restricting freedom or action).\n\nExample Sentences:\n\nNew regulations threatened to manacle the company’s ability to innovate.\n\nSynonyms: (noun) handcuff, shackle, restraint\n\n(verb) restrain, chain, fetter, restrict, bind, confine", "backImage": ""}, {"frontText": "modest", "frontImage": "", "backText": "1. unassuming in the estimation of one's abilities or achievements.\n2. (of an amount, rate, or level) relatively moderate, limited, or small.", "backImage": ""}, {"frontText": "noxious", "frontImage": "", "backText": "harmful, poisonous, or very unpleasant.", "backImage": ""}, {"frontText": "pernicious", "frontImage": "", "backText": "having a harmful effect, especially in a gradual or subtle way.", "backImage": ""}, {"frontText": "predicament", "frontImage": "", "backText": "a difficult, unpleasant, or embarrassing situation.", "backImage": ""}, {"frontText": "proficient", "frontImage": "", "backText": "competent or skilled in doing or using something.", "backImage": ""}, {"frontText": "prolix", "frontImage": "", "backText": "(of speech or writing) using or containing too many words; tediously lengthy.", "backImage": ""}, {"frontText": "scorn", "frontImage": "", "backText": "a feeling and expression of contempt or disdain for someone or something.", "backImage": ""}, {"frontText": "subordinate", "frontImage": "", "backText": "of less or secondary importance.", "backImage": ""}, {"frontText": "unseemly", "frontImage": "", "backText": "(of behavior or actions) not proper or appropriate.", "backImage": ""}, {"frontText": "veritable", "frontImage": "", "backText": "used for emphasis, often to qualify a metaphor.", "backImage": ""}]}, {"name": "Set 19", "emoji": "🧠", "smart": true, "cards": [{"frontText": "acolyte", "frontImage": "", "backText": "a person assisting a priest in a religious service or procession.", "backImage": ""}, {"frontText": "anoint", "frontImage": "", "backText": "1. smear or rub with oil, typically as part of a religious ceremony.\n2. nominate or choose (someone) as successor to or leading candidate for a position.", "backImage": ""}, {"frontText": "base", "frontImage": "", "backText": "Definition: Morally low, dishonorable, or lacking principles; showing no values or integrity.\n\nExample Sentences:\n\nIt was a base act of betrayal against a loyal friend.\n\nSynonyms: immoral, corrupt, vile, dishonorable, wicked, lowly, shameful", "backImage": ""}, {"frontText": "coercion", "frontImage": "", "backText": "the action or practice of persuading someone to do something by using force or threats.", "backImage": ""}, {"frontText": "coin", "frontImage": "", "backText": "1. invent\n2. a flat disc or piece of metal with an official stamp, used as money.", "backImage": ""}, {"frontText": "cunning", "frontImage": "", "backText": "having or showing skill in achieving one's ends by deceit or evasion.", "backImage": ""}, {"frontText": "discomfit", "frontImage": "", "backText": "make (someone) feel uneasy or embarrassed.", "backImage": ""}, {"frontText": "dissent", "frontImage": "", "backText": "hold or express opinions that are at variance with those commonly or officially held.", "backImage": ""}, {"frontText": "distill", "frontImage": "", "backText": "1. purify (a liquid) by heating it so that it vaporizes, then cooling and condensing the vapour and collecting the resulting liquid.", "backImage": ""}, {"frontText": "dubious", "frontImage": "", "backText": "1. hesitating or doubting.\n2. not to be relied upon; suspect.", "backImage": ""}, {"frontText": "ebullient", "frontImage": "", "backText": "cheerful and full of energy.", "backImage": ""}, {"frontText": "facetious", "frontImage": "", "backText": "treating serious issues with deliberately inappropriate humour; flippant.", "backImage": ""}, {"frontText": "fallible", "frontImage": "", "backText": "capable of making mistakes or being wrong.", "backImage": ""}, {"frontText": "florid", "frontImage": "", "backText": "1. excessively intricate or elaborate.\n2. having a red or flushed complexion.", "backImage": ""}, {"frontText": "gawky", "frontImage": "", "backText": "nervously awkward and ungainly.", "backImage": ""}, {"frontText": "inveigle", "frontImage": "", "backText": "persuade (someone) to do something by means of deception or flattery.", "backImage": ""}, {"frontText": "jettison", "frontImage": "", "backText": "abandon or discard (someone or something that is no longer wanted).", "backImage": ""}, {"frontText": "mendacity", "frontImage": "", "backText": "untruthfulness.", "backImage": ""}, {"frontText": "munificent", "frontImage": "", "backText": "characterized by or displaying great generosity.", "backImage": ""}, {"frontText": "naive", "frontImage": "", "backText": "(of a person or action) showing a lack of experience, wisdom, or judgement.", "backImage": ""}, {"frontText": "noble", "frontImage": "", "backText": "1. belonging by rank, title, or birth to the aristocracy.\n2. having or showing fine personal qualities or high moral principles.", "backImage": ""}, {"frontText": "parochial", "frontImage": "", "backText": "having a limited or narrow outlook or scope.", "backImage": ""}, {"frontText": "pedestrian", "frontImage": "", "backText": "1. a person walking rather than travelling in a vehicle.\n2. lacking inspiration or excitement; dull.", "backImage": ""}, {"frontText": "prevaricate", "frontImage": "", "backText": "speak or act in an evasive way.", "backImage": ""}, {"frontText": "prime", "frontImage": "", "backText": "1. of first importance; main.\n2. the state or time of greatest vigor or success in a person's life.\n3. make (something) ready for use or action.", "backImage": ""}, {"frontText": "radical", "frontImage": "", "backText": "1. (especially of change or action) relating to or affecting the fundamental nature of something; far-reaching or thorough.\n2. advocating or based on thorough or complete political or social change", "backImage": ""}, {"frontText": "recrudescent", "frontImage": "", "backText": "break out again; recur.", "backImage": ""}, {"frontText": "temporal", "frontImage": "", "backText": "Definition:\n\n-Related to worldly or material affairs, as opposed to spiritual or eternal matters.\n\n-Can also mean relating to time or limited by time.\n\nExample Sentences:\n\n-T he priest urged people to focus on spiritual rather than temporal concerns.\n\n- Scientists study the temporal patterns of climate change over centuries.\n\nSynonyms: earthly, worldly, secular, material, transient, time-related", "backImage": ""}, {"frontText": "transitory", "frontImage": "", "backText": "not permanent.", "backImage": ""}, {"frontText": "viable", "frontImage": "", "backText": "capable of working successfully;feasible", "backImage": ""}]}, {"name": "Set 20", "emoji": "🧠", "smart": true, "cards": [{"frontText": "abreast", "frontImage": "", "backText": "1.side by side and facing the same way.\n\n2. alongside or level with something.", "backImage": ""}, {"frontText": "confound", "frontImage": "", "backText": "Definition:\n\n- To cause surprise or confusion in someone, especially by acting against their expectations.\n\n- To mix up or mistake one thing for another.\n\nSynonyms: bewilder, confuse, perplex, baffle, fluster, mystify", "backImage": ""}, {"frontText": "digression", "frontImage": "", "backText": "a temporary departure from the main subject in speech or writing.", "backImage": ""}, {"frontText": "discrepancy", "frontImage": "", "backText": "an illogical or surprising lack of compatibility or similarity between two or more facts.", "backImage": ""}, {"frontText": "duplicitous", "frontImage": "", "backText": "deceitful.", "backImage": ""}, {"frontText": "expedient", "frontImage": "", "backText": "Definition:\n\n(adjective) Convenient and practical, though sometimes improper or immoral.\n\n(noun) A means of achieving an end, especially one that is convenient but possibly self-serving or unethical.\n\nExample Sentences:\n\nThe committee chose the most expedient solution rather than the most just one.\n\nSynonyms: convenient, practical, advantageous, strategic, self-serving, beneficial", "backImage": ""}, {"frontText": "fabricate", "frontImage": "", "backText": "1. invent (something) in order to deceive.\n2. construct or manufacture (an industrial product), especially from prepared components.", "backImage": ""}, {"frontText": "glum", "frontImage": "", "backText": "Definition: Looking or feeling sad, gloomy, or silently unhappy.\n\nExample Sentences:\n\nHe looked glum after hearing the bad news.\n\nSynonyms: gloomy, dejected, downcast, morose, sullen, melancholy", "backImage": ""}, {"frontText": "harbinger", "frontImage": "", "backText": "Definition: A person or thing that signals or foreshadows the approach of something else, usually a change or event.\n\nExample Sentences:\n\n- Dark clouds are a harbinger of an approaching storm.\n\nSynonyms: forerunner, omen, precursor, signal, indicator, messenger", "backImage": ""}, {"frontText": "intrinsic", "frontImage": "", "backText": "belonging naturally; essential.", "backImage": ""}, {"frontText": "largesse", "frontImage": "", "backText": "generosity in bestowing money or gifts upon others.", "backImage": ""}, {"frontText": "libertine", "frontImage": "", "backText": "Definition:\n\n-A person who behaves without moral restraint, especially in sexual matters.\n\n- Can also refer to someone who rejects conventional moral or religious values.\n\nExample Sentences:\n\nThe novelist was known for his libertine lifestyle and disregard for social norms.\n\nSynonyms: hedonist, debauchee, playboy, rake, free spirit, sensualist", "backImage": ""}, {"frontText": "manifest", "frontImage": "", "backText": "1. show (a quality or feeling) by one's acts or appearance; demonstrate.\n2. a document listing a ship's contents, cargo, passengers, and crew, for the use of customs officers.", "backImage": ""}, {"frontText": "minute (mynoot)", "frontImage": "", "backText": "Definition: Extremely small in size, detail, or importance; precise or meticulous.\n\nExample Sentences:\n\n- They detected a minute trace of chemicals in the sample.\n\nSynonyms: tiny, minuscule, microscopic, slight, detailed, precise", "backImage": ""}, {"frontText": "modish", "frontImage": "", "backText": "conforming to or following what is currently popular and fashionable.", "backImage": ""}, {"frontText": "nascent", "frontImage": "", "backText": "Definition: Beginning to exist or develop; in the early stages of growth or formation.\n\nExample Sentences:\n\n- The nascent solar industry is growing rapidly as technology improves.\n\nSynonyms: emerging, developing, budding, growing, incipient, embryonic", "backImage": ""}, {"frontText": "perennial", "frontImage": "", "backText": "lasting or existing for a long or apparently infinite time; enduring or continually recurring.", "backImage": ""}, {"frontText": "pious", "frontImage": "", "backText": "1. devoutly religious.\n2. (of a hope) sincere but unlikely to be fulfilled.", "backImage": ""}, {"frontText": "providential", "frontImage": "", "backText": "1. occurring at a favorable time; opportune.\n2. involving divine foresight or providence.", "backImage": ""}, {"frontText": "prowess", "frontImage": "", "backText": "1. skill or expertise in a particular activity or field.\n2. bravery in battle.", "backImage": ""}, {"frontText": "schism", "frontImage": "", "backText": "a split or division between strongly opposed sections or parties, caused by differences in opinion or belief.", "backImage": ""}, {"frontText": "slander", "frontImage": "", "backText": "make false and damaging statements about (someone).", "backImage": ""}, {"frontText": "stalwart", "frontImage": "", "backText": "loyal, reliable, and hard-working.", "backImage": ""}, {"frontText": "supplicate", "frontImage": "", "backText": "ask or beg for something earnestly or humbly.", "backImage": ""}, {"frontText": "terse", "frontImage": "", "backText": "Definition: Brief and direct in a way that may seem unfriendly or abrupt; using few words but getting straight to the point.\n\nExample Sentences:\n\nHer terse reply made it clear she didn’t want to continue the conversation.\n\nSynonyms: brief, concise, curt, succinct, short, blunt", "backImage": ""}, {"frontText": "tirade", "frontImage": "", "backText": "a long, angry speech of criticism or accusation.", "backImage": ""}, {"frontText": "universal", "frontImage": "", "backText": "relating to or done by all people or things in the world or in a particular group; applicable to all cases./ubiquitous", "backImage": ""}, {"frontText": "vanquish", "frontImage": "", "backText": "defeat thoroughly./conquer", "backImage": ""}, {"frontText": "woeful", "frontImage": "", "backText": "1. characterized by, expressive of, or causing sorrow or misery.\n2. very bad; deplorable.", "backImage": ""}, {"frontText": "malfeasance", "frontImage": "", "backText": "wrongdoing, especially (US) by a public official.", "backImage": ""}]}, {"name": "Set 21", "emoji": "🧠", "smart": true, "cards": [{"frontText": "abject", "frontImage": "", "backText": "adjective: most unfortunate or miserable\n\nThe captured soldier displayed abject terror.\n\nSynonyms:\n\n- wretched\n\n- deplorable\n\n- pitiable", "backImage": ""}, {"frontText": "amicable", "frontImage": "", "backText": "characterized by friendliness and absence of discord.", "backImage": ""}, {"frontText": "animosity", "frontImage": "", "backText": "strong hostility.", "backImage": ""}, {"frontText": "aver", "frontImage": "", "backText": "verb: assert with confidence\n\nHe avers that he was home at the time of the incident.\n\nSynonyms:\n\n- maintain\n\n- attest\n\n- avow", "backImage": ""}, {"frontText": "barrage", "frontImage": "", "backText": "1.bombard (someone) with questions, criticisms, complaints, etc.\n2. an artificial barrier across a river or estuary to prevent flooding, aid irrigation or navigation, or to generate electricity by tidal power.", "backImage": ""}, {"frontText": "cathartic", "frontImage": "", "backText": "providing psychological relief through the open expression of strong emotions; causing catharsis.", "backImage": ""}, {"frontText": "decipher", "frontImage": "", "backText": "succeed in understanding, interpreting, or identifying (something).", "backImage": ""}, {"frontText": "delusion", "frontImage": "", "backText": "noun:\n\na belief that is not true or is founded on false premises\n\nThe idea that he could fly was just a delusion.\n\nSynonyms:\n\nmisconception\n\nfallacy\n\nchimera", "backImage": ""}, {"frontText": "dispense", "frontImage": "", "backText": "1. distribute or provide to a number of people.\n2. manage without or get rid of.", "backImage": ""}, {"frontText": "eloquent", "frontImage": "", "backText": "fluent or persuasive in speaking or writing.", "backImage": ""}, {"frontText": "enthrall", "frontImage": "", "backText": "capture the fascinated attention of.", "backImage": ""}, {"frontText": "eradicate", "frontImage": "", "backText": "destroy completely; put an end to.", "backImage": ""}, {"frontText": "fledgling", "frontImage": "", "backText": "a person or organization that is immature, inexperienced, or underdeveloped.", "backImage": ""}, {"frontText": "fortitude", "frontImage": "", "backText": "courage in pain or adversity.", "backImage": ""}, {"frontText": "fortuitous", "frontImage": "", "backText": "happening by chance rather than intention./happening by a lucky chance; fortunate.", "backImage": ""}, {"frontText": "goad", "frontImage": "", "backText": "1. provoke or annoy (someone) so as to stimulate an action or reaction.\n2. drive (an animal) with a spiked stick.", "backImage": ""}, {"frontText": "imminent", "frontImage": "", "backText": "about to happen", "backImage": ""}, {"frontText": "incontrovertible", "frontImage": "", "backText": "not able to be denied or disputed.", "backImage": ""}, {"frontText": "itinerant", "frontImage": "", "backText": "travelling from place to place.", "backImage": ""}, {"frontText": "magnanimous", "frontImage": "", "backText": "generous or forgiving, especially towards a rival or less powerful person.", "backImage": ""}, {"frontText": "meritorious", "frontImage": "", "backText": "deserving reward or praise.", "backImage": ""}, {"frontText": "mutiny", "frontImage": "", "backText": "noun: a rebellion against authority; violent strife\n\nThe captain faced a mutiny from his crew.\n\nSynonyms:\n\n- insurrection\n\n- revolt\n\n- riot", "backImage": ""}, {"frontText": "paradoxical", "frontImage": "", "backText": "seemingly absurd or self-contradictory.", "backImage": ""}, {"frontText": "perseverance", "frontImage": "", "backText": "persistence in doing something despite difficulty or delay in achieving success.", "backImage": ""}, {"frontText": "render", "frontImage": "", "backText": "Definition: \n\nmake or provide\n\nOR\n\n(in a courtroom) deliver a verdict\n\nSentence: One must receive payment for services they render.\n\nSynonyms:\n\nfurnish\n\nproffer\n\nsupply", "backImage": ""}, {"frontText": "repertoire", "frontImage": "", "backText": "1. a stock of plays, dances, or items that a company or a performer knows or is prepared to perform.\n2. a stock of skills or types of behavior t async function maybeSeed(){
  const seed=window.__SEED__; if(!seed||!seed.decks) return;
  const existing=await getAll('decks');
  if(existing.some(d=>d.seedTag==='gre_v1')) return;
  const base=Date.now();
  for(let i=0;i<seed.decks.length;i++){
    const d=seed.decks[i]; const deckId=uid();
    await put('decks',{id:deckId,name:d.name,emoji:d.emoji||'🧠',smart:d.smart!==false,seedTag:'gre_v1',createdAt:base-i});
    for(const c of (d.cards||[])){
      await put('cards',{id:uid(),deckId,frontText:c.frontText||'',frontImage:c.frontImage||'',backText:c.backText||'',backImage:c.backImage||'',srs:freshSRS(),createdAt:Date.now()});
    }
  }
}

// One-time: nest all seeded GRE sets under a "GRE Words" parent folder
async function migrateGREWords(){
  const decks=await getAll('decks');
  if(decks.some(d=>d.greContainer)) return;            // already grouped
  const sets=decks.filter(d=>d.seedTag==='gre_v1' && !d.parentId);
  if(sets.length===0) return;
  const parentId=uid();
  await put('decks',{id:parentId,name:'GRE Words',emoji:'📚',smart:true,parentId:null,greContainer:true,createdAt:Date.now()+1});
  for(const s of sets){ s.parentId=parentId; await put('decks',s); }
}

// One-time cleanup: remove any auto-added LoremFlickr photos (user adds their own).
async function cleanupAutoImages(){
  const decks=await getAll('decks');
  const container=decks.find(d=>d.greContainer);
  if(container && container.imgCleaned) return;
  const cards=await getAll('cards');
  for(const c of cards){
    if(c.backImage && c.backImage.indexOf('loremflickr.com')>=0){ c.backImage=''; await put('cards',c); }
  }
  if(container){ container.imgCleaned=true; await put('decks',container); }
}
